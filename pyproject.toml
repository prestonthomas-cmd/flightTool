[project]
name = "flight-price-tracker"
version = "1.0.0"
description = "Watch specific flights, track their price history, and email a buy signal."
requires-python = ">=3.10"
dependencies = ["fast-flights>=2.2", "PyYAML>=6.0"]

[project.scripts]
flighttracker = "flighttracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flighttracker"]
