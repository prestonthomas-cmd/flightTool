[project]
name = "flight-price-tracker"
version = "1.0.0"
description = "Watch specific flights, track their price history, and email a buy signal."
requires-python = ">=3.10"
dependencies = [
    # 3.x for the create_query API; typing_extensions because fast-flights
    # imports it without declaring it.
    "fast-flights>=3.1,<4",
    "typing_extensions>=4.0",
    "PyYAML>=6.0",
]

[project.scripts]
flighttracker = "flighttracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flighttracker"]
