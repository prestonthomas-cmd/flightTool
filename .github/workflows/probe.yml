name: Probe for price history

# TEMPORARY, MANUAL ONLY. Answers one question: does Google's own response carry
# the price-history series behind its "price graph", in the free scrape?
# `fast-flights` only exposes that through a paid third-party integration, but
# it may simply not be parsing something already present. Delete this file once
# the question is answered.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Look for a (date, price) series in the raw response
        run: |
          python - <<'PY'
          import json, re, itertools
          from fast_flights import FlightQuery, create_query, fetch_flights_html

          q = create_query(
              flights=[FlightQuery(date="2026-12-10", from_airport="JFK", to_airport="HND")],
              trip="one-way", seat="economy", currency="USD",
          )
          html = fetch_flights_html(q)
          print(f"html bytes: {len(html):,}")

          blobs = re.findall(r"data:(.*?)(?:, sideChannel|\}\);)", html, re.S)
          print(f"data blobs found: {len(blobs)}")

          ISO = re.compile(r"^\d{4}-\d{2}-\d{2}$")

          def walk(node, path=""):
              """Yield (path, value) for every node."""
              if isinstance(node, list):
                  for i, v in enumerate(node):
                      yield from walk(v, f"{path}[{i}]")
              elif isinstance(node, dict):
                  for k, v in node.items():
                      yield from walk(v, f"{path}.{k}")
              else:
                  yield path, node

          dates_found = 0
          series_hits = []
          levels = []

          for n, blob in enumerate(blobs):
              try:
                  payload = json.loads(blob.rsplit(",", 1)[0] if blob.rstrip().endswith(",") else blob)
              except Exception:
                  continue
              flat = list(itertools.islice(walk(payload), 400000))
              iso = [(p, v) for p, v in flat if isinstance(v, str) and ISO.match(v)]
              dates_found += len(iso)
              # A price-history series shows up as many ISO dates under one parent.
              parents = {}
              for p, v in iso:
                  parents.setdefault(p.rsplit("[", 1)[0], []).append(v)
              for parent, values in parents.items():
                  if len(values) >= 8:
                      series_hits.append((n, parent, len(values), sorted(values)[:3], sorted(values)[-3:]))
              levels += [v for _, v in flat if isinstance(v, str) and v in ("low", "typical", "high")]

          print(f"ISO-date strings anywhere in payloads: {dates_found}")
          print(f"price_level-looking strings: {len(levels)} {levels[:5]}")
          print()
          if series_hits:
              print("CANDIDATE DATE SERIES (>=8 dates under one parent):")
              for n, parent, count, first, last in series_hits[:10]:
                  print(f"  blob {n} at {parent}: {count} dates, {first} ... {last}")
          else:
              print("NO date series found — Google is not sending a price history here.")
          PY
