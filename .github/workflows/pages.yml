name: Publish the dashboard

# OPT-IN, AND DELIBERATELY SO.
#
# A GitHub Pages site is PUBLIC even when the repository is private — outside
# Enterprise Cloud with access control there is no middle setting. Publishing
# puts your watchlist, your dates and your prices on a guessable public URL.
#
# BEFORE THE FIRST RUN, enable Pages by hand — once:
#   Settings > Pages > Build and deployment > Source: GitHub Actions
#
# The workflow asks to enable it automatically, but the Actions token is not
# always permitted to create a Pages site, and on this repository it is not:
# the first attempt failed with "Create Pages site failed. Error: Resource not
# accessible by integration". Enabling it by hand is a one-time step.
#
# Then, to publish:  Actions > "Publish the dashboard" > Run workflow.
#
# To publish after every tracking run:
#   set the repository variable PUBLISH_DASHBOARD to `true`
#   (Settings > Secrets and variables > Actions > Variables).
#
# Do neither and nothing is ever published. The tracker still builds
# `site/index.html` on every run and commits it to the repo, where it stays
# private — clone it and open the file.
#
# GitHub Pages for a *private* repository needs a paid plan. On the free plan
# the enablement step below fails, and the only way to publish is to make the
# repository public — which puts the source and the whole price history on
# show, not just the page.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Track flight prices"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    # A manual run is itself the deliberate act, so it does not also need the
    # variable; the automatic run after each tracking run does.
    if: github.event_name == 'workflow_dispatch' || vars.PUBLISH_DASHBOARD == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install PyYAML

      # Rebuilt from the committed database rather than trusting the committed
      # HTML, so the published page always matches the data in the repo.
      - run: python -m flighttracker dashboard --out site/index.html

      # Printed immediately above the failure it explains, because the raw
      # error from configure-pages says nothing about what to actually do.
      - name: If the next step fails, read this
        run: |
          echo "If the next step fails with 'Resource not accessible by"
          echo "integration' or 'Not Found', Pages is not enabled for this"
          echo "repository and this token cannot enable it. Do it by hand, once:"
          echo "  Settings > Pages > Build and deployment > Source: GitHub Actions"
          echo
          echo "If that page offers no such option, Pages is not available for a"
          echo "private repository on this account's plan. The alternatives are to"
          echo "upgrade the plan, or to make the repository public — which also"
          echo "publishes the source and the entire price history, not just the"
          echo "dashboard."

      # Asks to enable Pages automatically. Harmless where the token is allowed
      # to; where it is not, the message above says what to do instead.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Say where it went
        run: echo "Published to ${{ steps.deploy.outputs.page_url }}"
