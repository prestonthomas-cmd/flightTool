name: Publish the dashboard

# Publishes the dashboard to GitHub Pages after every tracking run, and on
# demand from the Actions tab.
#
# A Pages site is PUBLIC. So is this repository, which is what makes Pages
# available on a free plan at all — Pages from a *private* repo needs a paid
# plan. Everything the page shows is already public in the repo: the code, the
# price history in `data/`, and `watches.yaml`. Bear that last one in mind when
# you put real trips in it.
#
# ONE-TIME SETUP, if the deploy fails:
#   Settings > Pages > Build and deployment > Source: GitHub Actions
# The workflow asks to enable Pages itself, but the Actions token is not always
# permitted to create the site — the first attempt here failed with "Resource
# not accessible by integration". Setting the source by hand fixes it for good.
#
# To stop publishing: set the repository variable PUBLISH_DASHBOARD to `false`
# (Settings > Secrets and variables > Actions > Variables), or disable this
# workflow. The tracker still commits `index.html` to the repo root either way,
# which is also what Pages serves in "deploy from a branch" mode.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Track flight prices"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    # Publishes by default now that the repository is public. Setting
    # PUBLISH_DASHBOARD to `false` turns the automatic runs off without
    # touching this file; a manual run always goes ahead.
    if: github.event_name == 'workflow_dispatch' || vars.PUBLISH_DASHBOARD != 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install PyYAML

      # Rebuilt from the committed database rather than trusting the committed
      # HTML, so the published page always matches the data in the repo. Staged
      # into site/ because the upload publishes a directory's contents as the
      # site root; the repo's own index.html covers the branch-deploy mode.
      - run: |
          python -m flighttracker dashboard --out index.html
          mkdir -p site
          cp index.html site/index.html
          touch site/.nojekyll

      # Printed immediately above the failure it explains, because the raw
      # error from configure-pages says nothing about what to actually do.
      - name: If the next step fails, read this
        run: |
          echo "If the next step fails with 'Resource not accessible by"
          echo "integration' or 'Not Found', Pages is not enabled for this"
          echo "repository and this token cannot enable it. Do it by hand, once:"
          echo "  Settings > Pages > Build and deployment > Source: GitHub Actions"
          echo
          echo "If that page offers no such option, Pages is not available for a"
          echo "private repository on this account's plan. The alternatives are to"
          echo "upgrade the plan, or to make the repository public — which also"
          echo "publishes the source and the entire price history, not just the"
          echo "dashboard."

      # Asks to enable Pages automatically. Harmless where the token is allowed
      # to; where it is not, the message above says what to do instead.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Say where it went
        run: echo "Published to ${{ steps.deploy.outputs.page_url }}"
