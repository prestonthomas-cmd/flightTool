name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The suite needs PyYAML and nothing else: it drives a stub fetcher, so it
      # never reaches Google Flights and never opens a socket.
      - run: pip install PyYAML
      - run: python -m unittest discover -s tests -t . -v
